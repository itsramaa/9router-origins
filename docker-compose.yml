services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:local
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}

volumes:
  9router-data:
    name: 9router-data
